<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Finder AI 🌿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-green-50 min-h-screen font-sans">

    <div class="max-w-2xl mx-auto py-10 px-4">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-green-800 mb-2">🌿 Plant Finder AI</h1>
            <p class="text-green-600">Identifica le tue piante e scopri come curarle.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome della pianta</label>
                    <input type="text" id="plantName" placeholder="Es: Monstera Deliciosa" 
                        class="w-full p-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                </div>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-sm">oppure</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-green-300 border-dashed rounded-lg cursor-pointer bg-green-50 hover:bg-green-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <i class="fas fa-camera text-2xl text-green-600 mb-2"></i>
                            <p class="text-sm text-green-700">Carica una foto dal giardino</p>
                        </div>
                        <input id="imageInput" type="file" class="hidden" accept="image/*" />
                    </label>
                </div>

                <button onclick="analyzePlant()" id="btnAnalyze"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center">
                    <i class="fas fa-search mr-2"></i> Analizza Pianta
                </button>
            </div>
        </div>

        <div id="resultCard" class="hidden bg-white rounded-2xl shadow-lg p-6 animate-pulse">
            <div id="loading" class="text-center text-gray-500">
                <p>Analizzando i cloroplasti... 🧪</p>
            </div>
            <div id="content" class="hidden prose prose-green max-w-none">
                </div>
        </div>
    </div>

    <script>
        async function analyzePlant() {
            const name = document.getElementById('plantName').value;
            const fileInput = document.getElementById('imageInput');
            const resultCard = document.getElementById('resultCard');
            const content = document.getElementById('content');
            
            // Logica placeholder per dimostrazione
            resultCard.classList.remove('hidden');
            content.classList.add('hidden');
            
            // Simulazione chiamata API
            setTimeout(() => {
                resultCard.classList.remove('animate-pulse');
                content.classList.remove('hidden');
                document.getElementById('loading').classList.add('hidden');
                
                content.innerHTML = `
                    <h2 class="text-2xl font-bold text-green-800 border-b pb-2 mb-4">Risultato</h2>
                    <p class="mb-4">Per collegare questo file HTML alle API di Gemini, è necessario un piccolo server "ponte" (backend) in Python o Node.js per proteggere la tua chiave segreta.</p>
                    <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                        <strong>Nota:</strong> Hai creato l'interfaccia! Ora devi collegarla al codice Python che abbiamo scritto prima usando un framework come <em>FastAPI</em> o <em>Flask</em>.
                    </div>
                `;
            }, 1500);
        }
    </script>
</body>
</html>
